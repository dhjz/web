
<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网盘搜索聚合</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232563eb'/%3E%3Cstop offset='.55' stop-color='%233b82f6'/%3E%3Cstop offset='1' stop-color='%230ea5e9'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ccircle cx='28' cy='28' r='12' fill='none' stroke='%23fff' stroke-width='5'/%3E%3Cline x1='37' y1='37' x2='49' y2='49' stroke='%23fff' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    var apps = [
      { name: '影盘社', url: 'https://www.yingpanshe.com/search?q=%s' },
      { name: '神族九帝', url: 'https://panhub.shenzjd.com/?q=%s' },
      { name: 'pansou.pro', url: 'https://pansou.pro/search?q=%s' },
      { name: '网盘搜', url: 'https://www.wangpansou.com/search.php?kw=%s' },
      { name: 'pansou.so', url: 'https://www.pansou.co/s/%s.html' },
      { name: 'pansou.de', url: 'https://pansou.de/search?q=%s' },
      { name: 'dddisk.com', url: 'https://so.dddisk.com/list.html?q=%s' },
      { name: '网盘搜索', url: 'https://www.wangpansousuo.com/s/%s.html' },
      { name: 'pansou.us', url: 'https://www.pansou.us' },
      { name: 'pansou.app', url: 'https://pansou.app', blank: false },
    ]
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-size: 14px; }
    body { font-family: Arial, sans-serif; height: 100dvh; overflow: hidden; }
    #app { display: flex; height: 100dvh; }
    input, select { background-color: #fff; border-radius: 4px; border: 1px solid #dcdfe6;  color: #333; line-height: 32px; padding: 0 4px; outline: none; margin: 0 4px; display: inline-block; max-width: 96%; }
    .sidebar { flex: none; height: 100dvh; width: 170px; background-color: #f5f5f5; border-right: 1px solid #ddd; overflow: auto; }
    .sb-hide .sidebar { width: 0; border-right: none; overflow: hidden; }
    .sidebar-list { list-style: none; overflow-y: auto; height: calc(100% - 50px); margin-top: 10px; }
    .sidebar-list li { padding: 8px 10px; cursor: pointer; border-bottom: 1px solid #eee; transition: background-color 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sidebar-list li:hover { background-color: #e9e9e9; }
    .sidebar-list li.active { background-color: #007bff; color: white; }
    .sidebar-list li i {font-size: 12px; float: right; opacity: .6; user-select: none; }
    .content { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
    .toggle-btn { position: absolute; top: 4px; left: 4px; background-color: rgba(255, 255, 255, 0.9); border: 1px solid #ddd; 
      border-radius: 50%; cursor: pointer; font-size: 13px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; 
      z-index: 1000; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2); opacity: 1; }
    .toggle-btn:hover { background-color: #f0f0f0; }
    .iframe-container { flex: 1; width: 100%; border: none; }
    .blank-tip { padding: 40px; color: #999; text-align: center; user-select: none; }
    .input-row { display: flex; align-items: center; margin: 0 8px; }
    .input-row input { flex: 1; min-width: 0; max-width: none; margin: 0; }
    .input-row .clear-btn { flex: none; width: 26px; height: 26px; line-height: 1; margin-left: 4px; cursor: pointer;
      border: 1px solid #dcdfe6; border-radius: 4px; background-color: #fff; color: #999; font-size: 12px; }
    .input-row .clear-btn:hover { color: #333; border-color: #bbb; background-color: #f5f5f5; }
    /* 移动端：导航栏悬浮覆盖，不挤压内容 */
    @media (max-width: 767px) {
      .sidebar { position: fixed; left: 0; top: 0; z-index: 1; }
      .toggle-btn { left: 178px; }
      .sb-hide .toggle-btn { left: 4px; }
    }
    /* PC 端：导航栏与内容区平级 */
    @media (min-width: 768px) {
      .sidebar { width: 210px; }
    }
    /* 进入弹框 */
    .intro-mask { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center;
      background: rgba(15, 23, 42, .55); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .intro-card { width: min(520px, 88vw); background: #fff; border-radius: 20px; padding: 44px 40px 36px; text-align: center;
      box-shadow: 0 24px 80px rgba(15, 23, 42, .35); }
    .intro-logo { width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 16px; display: flex; align-items: center; justify-content: center;
      font-size: 28px; background: linear-gradient(135deg, #2563eb, #3b82f6 55%, #0ea5e9); box-shadow: 0 10px 24px rgba(59, 130, 246, .35); }
    .intro-title { font-size: 24px; margin-bottom: 14px; font-weight: 700; letter-spacing: 2px;
      background: linear-gradient(90deg, #2563eb, #3b82f6 55%, #0ea5e9); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .intro-sub { margin: 10px 0 26px; color: #94a3b8; font-size: 13px; letter-spacing: 4px; }
    .intro-search { display: flex; align-items: center; padding: 4px 4px 4px 18px; border-radius: 999px; border: 1px solid #e2e8f0;
      background: #f8fafc; transition: all .25s ease; }
    .intro-search:focus-within { border-color: #93c5fd; background: #fff; box-shadow: 0 0 0 4px rgba(37, 99, 235, .12); }
    .intro-search input { flex: 1; min-width: 0; border: none; background: transparent; line-height: 38px; font-size: 15px; margin: 0; padding: 0; max-width: none; }
    .intro-go { flex: none; height: 38px; padding: 0 24px; border: none; border-radius: 999px; cursor: pointer; color: #fff; font-size: 14px; letter-spacing: 2px;
      background: linear-gradient(135deg, #2563eb, #3b82f6 55%, #0ea5e9); box-shadow: 0 6px 16px rgba(59, 130, 246, .35); transition: transform .2s ease, box-shadow .2s ease; }
    .intro-go:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(59, 130, 246, .45); }
    .intro-go:active { transform: none; }
    .intro-skip { margin-top: 18px; color: #6a717a; font-size: 12px; cursor: pointer; user-select: none; transition: color .2s; }
    .intro-skip:hover { color: #525b68; }
  </style>
</head>
<body>
  <div id="app">
    <div class="sidebar">
      <div class="input-row">
        <input id="keywordInput" type="text" placeholder="关键词回车搜索">
        <button class="clear-btn" id="clearBtn" title="清空">✕</button>
      </div>
      <ul class="sidebar-list" id="siteList"></ul>
    </div>
    <div class="content" id="content">
      <button class="toggle-btn" id="toggleBtn">◀</button>
      <div class="blank-tip" id="blankTip" hidden>该站点不支持内嵌，点击左侧导航将在新页面打开 ↗</div>
    </div>
    <div class="intro-mask" id="introMask">
      <div class="intro-card">
        <div class="intro-logo">🔍</div>
        <div class="intro-title">网盘搜索聚合</div>
        <div class="intro-search">
          <input id="introInput" type="text" placeholder="请输入网盘搜索关键字">
          <button class="intro-go" id="introGo">搜索</button>
        </div>
        <div class="intro-skip" id="introSkip">跳过，直接浏览 →</div>
      </div>
    </div>
  </div>
  <!-- <script src="data.js"></script> -->
  <script>
    (function () {
      var $list = document.getElementById('siteList');
      var $content = document.getElementById('content');
      var $blankTip = document.getElementById('blankTip');
      var $keyword = document.getElementById('keywordInput');
      var $introInput = document.getElementById('introInput');
      var $introMask = document.getElementById('introMask');
      var $toggleBtn = document.getElementById('toggleBtn');

      var sites = [];
      var currInd = 0;
      var isSbHide = false;

      // 按关键词生成各站点的实际地址，并重置加载状态
      function resetSites() {
        var keyword = $keyword.value;
        sites = apps.map(function (item) {
          var url;
          if (keyword) {
            url = item.url.indexOf('%s') > -1 ? item.url.replace('%s', encodeURIComponent(keyword)) : item.url;
          } else {
            url = new URL(item.url).origin;
          }
          return { name: item.name, url: url, blank: !!item.blank, loaded: false, el: null };
        });

        Array.prototype.forEach.call($content.querySelectorAll('.iframe-container'), function (el) {
          el.parentNode.removeChild(el);
        });

        var firstInd = -1;
        for (var i = 0; i < sites.length; i++) {
          if (!sites[i].blank) { firstInd = i; break; }
        }
        if (firstInd > -1) {
          sites[firstInd].loaded = true;
          currInd = firstInd;
        }

        renderList();
        syncView();
      }

      function renderList() {
        $list.innerHTML = '';
        sites.forEach(function (site, index) {
          var li = document.createElement('li');
          li.title = site.name;
          li.className = index === currInd ? 'active' : '';
          li.appendChild(document.createTextNode(site.name + ' '));

          var icon = document.createElement('i');
          icon.textContent = site.blank ? '↗' : '🔗';
          icon.addEventListener('click', function (e) {
            e.stopPropagation();
            window.open(site.url);
          });
          li.appendChild(icon);

          li.addEventListener('click', function () {
            selectSite(index);
          });
          $list.appendChild(li);
        });
      }

      function updateActive() {
        Array.prototype.forEach.call($list.children, function (li, index) {
          li.className = index === currInd ? 'active' : '';
        });
      }

      // 同步 iframe 的创建与显隐
      function syncView() {
        sites.forEach(function (site, index) {
          if (site.blank) return;
          if (site.loaded && !site.el) {
            var iframe = document.createElement('iframe');
            iframe.className = 'iframe-container';
            iframe.setAttribute('frameborder', '0');
            iframe.setAttribute('allowfullscreen', '');
            iframe.src = site.url;
            $content.insertBefore(iframe, $blankTip);
            site.el = iframe;
          }
          if (site.el) {
            site.el.style.display = index === currInd ? '' : 'none';
          }
        });

        var currSite = sites[currInd];
        $blankTip.hidden = !(currSite && currSite.blank);
      }

      function selectSite(index) {
        var site = sites[index];
        if (!site) return;
        if (site.blank) {
          window.open(site.url);
          return;
        }
        site.loaded = true;
        currInd = index;
        updateActive();
        syncView();
      }

      function doSearch() {
        resetSites();
      }

      function closeIntro() {
        $introMask.style.display = 'none';
      }

      $keyword.addEventListener('input', function () {
        $introInput.value = $keyword.value;
      });
      $keyword.addEventListener('keyup', function (e) {
        if (e.key === 'Enter') doSearch();
      });

      $introInput.addEventListener('input', function () {
        $keyword.value = $introInput.value;
      });
      $introInput.addEventListener('keyup', function (e) {
        if (e.key === 'Enter') {
          doSearch();
          closeIntro();
        }
      });

      document.getElementById('clearBtn').addEventListener('click', function () {
        $keyword.value = '';
        $introInput.value = '';
        doSearch();
      });

      document.getElementById('introGo').addEventListener('click', function () {
        doSearch();
        closeIntro();
      });

      document.getElementById('introSkip').addEventListener('click', closeIntro);

      $introMask.addEventListener('click', function (e) {
        if (e.target === $introMask) closeIntro();
      });

      $toggleBtn.addEventListener('click', function () {
        isSbHide = !isSbHide;
        document.body.classList.toggle('sb-hide', isSbHide);
        $toggleBtn.textContent = isSbHide ? '▶' : '◀';
      });

      resetSites();
      $introInput.focus();
    })();
  </script>
</body>
</html>
