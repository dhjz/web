<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>光速跃迁 · GitHub 加速站</title>
<style>
:root{color-scheme:light;--bg:#f4f8ff;--bg2:#e4edff;--ink:#0b1c38;--muted:#5f7396;--line:rgba(20,70,150,.14);--glass:rgba(255,255,255,.68);--glass2:rgba(255,255,255,.86);--a1:#0a63ff;--a2:#00bfa8;--a3:#8b3bff;--ok:#00ab74;--warn:#e8a100;--bad:#ff4d6d;--glow:rgba(10,99,255,.18);--glow2:rgba(0,191,168,.12);--shadow:0 18px 46px rgba(24,60,130,.12);--mono:"SFMono-Regular",Consolas,"Liberation Mono","Roboto Mono",monospace}
html[data-theme="dark"]{color-scheme:dark;--bg:#050912;--bg2:#0a1530;--ink:#e9f3ff;--muted:#8199bd;--line:rgba(120,180,255,.16);--glass:rgba(11,22,44,.62);--glass2:rgba(15,28,56,.86);--a1:#3d8bff;--a2:#28e6c8;--a3:#b57bff;--ok:#2be0a0;--warn:#ffc857;--bad:#ff6b8b;--glow:rgba(61,139,255,.22);--glow2:rgba(140,90,255,.16);--shadow:0 18px 56px rgba(0,0,0,.55)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{min-height:100vh;font-size:14px;background:radial-gradient(1100px 620px at 10% -8%,var(--bg2),transparent 62%),radial-gradient(900px 560px at 96% 4%,var(--glow2),transparent 58%),var(--bg);color:var(--ink);font-family:"Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow-x:hidden;transition:background .5s,color .5s}
.fx{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.9}
.bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:46px 46px;-webkit-mask-image:radial-gradient(circle at 50% 26%,#000 8%,transparent 78%);mask-image:radial-gradient(circle at 50% 26%,#000 8%,transparent 78%);opacity:.8}
.orb{position:fixed;z-index:0;border-radius:50%;filter:blur(90px);pointer-events:none;opacity:.42;animation:drift 15s ease-in-out infinite alternate}
.orb-a{width:420px;height:420px;top:-140px;left:-90px;background:var(--a1)}
.orb-b{width:390px;height:390px;bottom:-150px;right:-100px;background:var(--a3);animation-delay:-7s}
.scan{position:fixed;left:0;right:0;height:1px;z-index:1;pointer-events:none;background:linear-gradient(90deg,transparent,var(--a2),transparent);opacity:.5;animation:scan 9s linear infinite}
.wrap{position:relative;z-index:2;max-width:1280px;margin:0 auto;padding:16px 24px 28px}
.top{display:flex;align-items:center;gap:16px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:var(--glass);backdrop-filter:blur(18px);box-shadow:var(--shadow);position:relative;overflow:hidden}
.top::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3))}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
.mark{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-size:20px;color:#fff;background:linear-gradient(135deg,var(--a1),var(--a3));animation:glow 3.2s ease-in-out infinite}
.brand-h1{font-size:18px;font-weight:800;letter-spacing:.1em;white-space:nowrap;background:linear-gradient(90deg,var(--a1),var(--a3));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:flex;gap:8px;margin-left:auto}
.stat{min-width:96px;padding:4px 12px;border:1px solid var(--line);border-radius:10px;background:var(--glass2)}
.stat-k{font-size:12px;color:var(--muted)}
.stat-v{font-family:var(--mono);font-size:18px;font-weight:700;color:var(--a1);margin-top:2px;line-height:1.25;white-space:nowrap}
.tools{display:flex;gap:8px;flex-shrink:0}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--glass2);color:var(--ink);font-size:18px;cursor:pointer;display:grid;place-items:center;transition:.25s}
.icon-btn:hover{transform:translateY(-2px);border-color:var(--a1);box-shadow:0 0 18px var(--glow)}
.icon-btn:disabled{opacity:.45;cursor:wait}
.icon-btn.is-spin{animation:spin 1.1s linear infinite}
.hero{padding:16px 4px 16px}
.hero-h2{font-size:clamp(24px,3.4vw,26px);font-weight:800;line-height:1.2;letter-spacing:-.02em}
.hero-h2 em{font-style:normal;background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3),var(--a1));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:hue 7s linear infinite}
.hero-bar{height:2px;margin:0 0 10px;border-radius:4px;background:var(--line);overflow:hidden}
.hero-fill{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--a1),var(--a2),var(--a3));box-shadow:0 0 14px var(--a2);transition:width .35s}
.panel{position:relative;padding:14px 16px;margin-bottom:12px;border:1px solid var(--line);border-radius:16px;background:var(--glass);backdrop-filter:blur(20px);box-shadow:var(--shadow);overflow:hidden}
.panel::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--a1),var(--a2),transparent 76%);opacity:.85}
.panel::after{content:"";position:absolute;bottom:12px;right:14px;width:10px;height:10px;border-bottom:2px solid var(--a2);border-right:2px solid var(--a2);opacity:.4;pointer-events:none}
.panel-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.panel-n{font-family:var(--mono);font-size:12px;color:var(--a1);border:1px solid var(--line);border-radius:7px;padding:3px 8px}
.panel-t{font-size:14px;font-weight:700;letter-spacing:.06em}
.panel-x{margin-left:auto;font-size:12px;color:var(--muted)}
.nodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;max-height:999px;overflow-y:auto;padding:2px 6px 2px 2px;scrollbar-width:thin;scrollbar-color:var(--a1) transparent}
.nodes::-webkit-scrollbar{width:6px}
.nodes::-webkit-scrollbar-track{background:transparent}
.nodes::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px}
.node{position:relative;text-align:left;padding:6px 6px;border:1px solid var(--line);border-radius:11px;background:var(--glass2);color:var(--ink);font-family:inherit;cursor:pointer;overflow:hidden;transition:transform .2s,box-shadow .2s,border-color .2s}
.node:hover{transform:translateY(-2px);border-color:var(--a1);box-shadow:0 8px 18px var(--glow)}
.node:focus-visible{outline:2px solid var(--a2);outline-offset:2px}
.node::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,var(--glow2),transparent 55%);opacity:0;transition:opacity .3s;pointer-events:none}
.node:hover::before{opacity:1}
.node.is-active{border-color:var(--a1);box-shadow:0 0 0 1px var(--a1),0 8px 20px var(--glow)}
.node.is-dead{opacity:.6}
.node-top{display:flex;align-items:center;gap:6px}
.node-name{flex:1;min-width:0;font-family:var(--mono);font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node-ms{font-family:var(--mono);font-size:16px;font-weight:800;line-height:1;color:var(--a2)}
.node-unit{font-size:12px;color:var(--muted)}
.node-bar{height:4px;margin-top:10px;border-radius:4px;background:var(--line);overflow:hidden}
.node-fill{height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--a1),var(--a2));transition:width .6s cubic-bezier(.2,.8,.2,1)}
.node.is-slow .node-fill{background:linear-gradient(90deg,var(--warn),var(--bad))}
.node.is-pending .node-fill{width:38%!important;background:linear-gradient(90deg,transparent,var(--a2),transparent);background-size:200% 100%;animation:sweep 1.1s linear infinite}
.node.is-dead .node-fill{width:3%;background:var(--bad)}
.node-dot{flex-shrink:0;display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);animation:pulse 1.8s ease-in-out infinite}
.node-dot.is-ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.node-dot.is-warn{background:var(--warn);box-shadow:0 0 8px var(--warn)}
.node-dot.is-bad{background:var(--bad);box-shadow:0 0 8px var(--bad)}
.field{display:flex;align-items:center;gap:12px;padding:2px 14px;border:1px solid var(--line);border-radius:12px;background:var(--glass2);transition:.25s}
.field:focus-within{border-color:var(--a1);box-shadow:0 0 0 3px var(--glow)}
.field-icon{font-size:16px;filter:drop-shadow(0 0 8px var(--glow))}
.url-input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-family:var(--mono);font-size:14px;padding:9px 0}
.url-input::placeholder{color:var(--muted);opacity:.75}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:0px}
.chip{font-size:12px;color:var(--muted);background:var(--glass2);border:1px dashed var(--line);border-radius:100px;padding:6px 12px;cursor:pointer;transition:.2s}
.chip:hover{color:var(--a1);border-color:var(--a1);transform:translateY(-2px)}
.out{position:relative;padding:11px 16px;border:1px solid var(--a1);border-radius:12px;background:linear-gradient(135deg,var(--glow2),transparent 60%),var(--glass2);box-shadow:inset 0 0 30px var(--glow);overflow:hidden}
.out::after{content:"";position:absolute;left:0;bottom:0;width:32%;height:2px;background:linear-gradient(90deg,transparent,var(--a1),transparent);background-size:200% 100%;animation:sweep 3s linear infinite}
.out-label{font-size:12px;color:var(--a2);margin-bottom:0px}
.out-link{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ink);word-break:break-all;line-height:1.6;max-height:3.2em;overflow-y:auto;user-select:all}
.out-link.is-empty{color:var(--muted);font-weight:400}
.out-link.is-error{color:var(--bad);font-weight:400}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:9px;padding:8px 18px;border:1px solid var(--line);border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;transition:.25s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:2px solid var(--a2);outline-offset:3px}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none;filter:grayscale(.6)}
.btn-copy{background:var(--glass2);color:var(--ink);border-color:var(--a1)}
.btn-copy:hover{box-shadow:0 10px 24px var(--glow)}
.btn-go{background:linear-gradient(100deg,var(--a1),var(--a3));color:#fff;border-color:transparent;box-shadow:0 10px 26px var(--glow)}
.btn-go:hover{box-shadow:0 14px 34px var(--glow);filter:brightness(1.08)}
.toast{position:fixed;left:50%;bottom:24px;z-index:9;transform:translate(-50%,20px);padding:12px 22px;border-radius:11px;background:var(--ink);color:var(--bg);font-size:14px;opacity:0;pointer-events:none;transition:.3s;box-shadow:0 16px 40px var(--glow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@keyframes drift{0%{transform:translate3d(0,0,0) scale(1)}100%{transform:translate3d(40px,30px,0) scale(1.12)}}
@keyframes scan{0%{top:-2%}100%{top:102%}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}
@keyframes glow{0%,100%{box-shadow:0 8px 24px var(--glow)}50%{box-shadow:0 8px 38px var(--a1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sweep{0%{background-position:0% 0}100%{background-position:200% 0}}
@keyframes hue{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@media(max-width:980px){
.stats{display:none}
}
@media(max-width:720px){
.wrap{padding:12px 14px 24px}
.top{padding:10px}
.hero{padding:20px 2px 16px}
.panel{padding:10px}
.actions{grid-template-columns:1fr}
.nodes{max-height:210px}
}
</style>
</head>
<body>
<div class="bg-grid"></div>
<canvas class="fx" id="fx"></canvas>
<div class="orb orb-a"></div>
<div class="orb orb-b"></div>
<div class="scan"></div>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark">🛰️</div>
      <div class="brand-h1">光速跃迁</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-k">在线节点</div><div class="stat-v" id="statOnline">--</div></div>
      <div class="stat"><div class="stat-k">最优延迟</div><div class="stat-v" id="statBest">--</div></div>
    </div>
    <div class="tools">
      <button class="icon-btn" id="rescanBtn" type="button" title="重新测速">↻</button>
      <button class="icon-btn" id="themeBtn" type="button" title="切换主题">🌙</button>
    </div>
  </header>

  <section class="hero"><h2 class="hero-h2">GitHub 加速 <em>光速跃迁</em></h2></section>

  <main>
    <section class="panel">
      <div class="panel-h">
        <span class="panel-n">01</span><span class="panel-t">粘贴链接</span>
        <div class="chips" id="chips">
          <button class="chip" type="button" data-url="https://github.com/microsoft/vscode/archive/refs/heads/main.zip">📦 源码包</button>
          <button class="chip" type="button" data-url="https://raw.githubusercontent.com/github/gitignore/main/Node.gitignore">📄 文件</button>
          <button class="chip" type="button" data-url="https://huggingface.co/">🌍 海外站点</button>
        </div>
    </div>
      <div class="field">
        <span class="field-icon">🔗</span>
        <input class="url-input" id="url" type="text" spellcheck="false" autocomplete="off" autofocus placeholder="粘贴 GitHub 或海外链接">
      </div>
    </section>

    <section class="panel">
      <div class="panel-h">
        <span class="panel-n">02</span><span class="panel-t">加速结果</span>
        <div class="out-label" id="relay">加速链接</div>
    </div>
      <div class="out">
        <div class="out-link is-empty" id="out">等待输入链接…</div>
      </div>
      <div class="actions">
        <button class="btn btn-copy" id="copyBtn" type="button" disabled>📋 复制加速链接</button>
        <button class="btn btn-go" id="goBtn" type="button" disabled>🚀 新窗口下载</button>
      </div>
    </section>

    <section class="panel">
      <div class="panel-h"><span class="panel-n">03</span><span class="panel-t">节点延迟</span><span class="panel-x" id="nodeMeta">点击卡片切换</span></div>
      <div class="hero-bar"><div class="hero-fill" id="scanFill"></div></div>
      <div class="nodes" id="nodes"></div>
    </section>
  </main>
</div>

<div class="toast" id="toast"></div>
<script src="index.js"></script>
</body>
</html>
